name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      kotlin_source:
        description: "Path to the Kotlin MainActivity source"
        required: false
        default: "examples/kotlin/MainActivity.kt"
        type: string
  push:
    paths:
      - 'android-runtime/**'
      - 'examples/kotlin/**'
      - 'tools/build-kotlin-apk.mjs'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inject Kotlin application
        env:
          KOTLIN_SOURCE: ${{ inputs.kotlin_source || 'examples/kotlin/MainActivity.kt' }}
        run: node tools/build-kotlin-apk.mjs --source "$KOTLIN_SOURCE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arr-app-debug-apk
          path: android-runtime/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
